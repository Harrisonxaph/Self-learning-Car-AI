<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A browser sandbox where cars learn to drive through evolved neural networks." />
    <title>Self-Driving AI Evolution</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Self-Driving AI Evolution</h1>
        <p>
          Simulation time: <output id="sim-time" data-tick="0">0.0 s</output>. Cars and driving arrive in the next Phase 1
          tasks.
        </p>
      </header>
      <div class="stage">
        <canvas id="sim-canvas" role="img" aria-label="Racetrack (no cars yet)"></canvas>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
